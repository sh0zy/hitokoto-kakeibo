<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="description" content="金額だけ・ひとことで記録できる家計簿。音声入力・まとめ入力・ショートカットに対応。記録は端末内に保存します。" />
    <meta name="theme-color" content="#f4f2ec" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>ひとこと家計簿</title>
    <script>
      // 描画前に表示の設定を反映して、ちらつきを防ぐ
      try {
        var p = JSON.parse(localStorage.getItem('hitokoto:display') || '{}')
        var t = p.theme || 'system'
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        var r = document.documentElement
        r.dataset.theme = dark ? 'dark' : 'light'
        r.dataset.scale = p.textScale || 'normal'
        if (p.reduceMotion) r.dataset.motion = 'reduce'
      } catch (e) {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
    <script type="module" crossorigin src="./assets/index-BclnvRF3.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-CXJnWtfx.css">
  </head>
  <body>
    <div id="root"></div>
    <noscript>ひとこと家計簿を使うには JavaScript を有効にしてください。</noscript>
  </body>
</html>
